name: Build and Deploy Feed

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-feed
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build site and feed
        env:
          SITE_URL: ${{ vars.FEED_SITE_URL || 'https://pulsar-feed.pages.dev' }}
        run: node scripts/build.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=pulsar-feed --commit-dirty=true

      - name: Commit regenerated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "build: regenerate site and feed [skip ci]"
          git push
