name: "New post"
description: Publish a new post to the feed
title: "New post: "
labels: ["create"]
body:
  - type: markdown
    attributes:
      value: Only the repository owner can publish content. Issues from other users are ignored.
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: "PulsarOS 2.0 available"
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
      description: Must exist in content/categories.json (releases, progress, announcements...). Create a new one with the "New category" template.
      placeholder: "releases"
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Slug (optional)
      description: Short identifier for the feed URL. Generated from the title if left empty.
      placeholder: "pulsaros-2-0"
  - type: textarea
    id: body
    attributes:
      label: Content (markdown)
      description: Supports **bold**, *italic*, links, lists, `code` and images.
      placeholder: "What is included in this release..."
    validations:
      required: true
