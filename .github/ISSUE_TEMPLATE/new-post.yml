name: "📰 Nueva noticia"
description: Crea una nueva noticia en el feed
title: "📰 Nueva noticia: "
labels: ["create"]
body:
  - type: input
    id: title
    attributes:
      label: Título
      placeholder: "PulsarOS 2.0 disponible"
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Categoría
      description: Debe existir en content/categories.json (releases, progress, announcements...). Crea una nueva con la plantilla "🏷️ New category".
      placeholder: "releases"
    validations:
      required: true
  - type: input
    id: slug
    attributes:
      label: Slug (opcional)
      description: Identificador corto en la URL del feed. Se genera del título si se deja vacío.
      placeholder: "pulsaros-2-0"
  - type: textarea
    id: body
    attributes:
      label: Contenido (markdown)
      description: Soporta **negrita**, *cursiva*, enlaces, listas, `código` e imágenes.
      placeholder: "Qué novedades incluye esta versión..."
    validations:
      required: true
