name: "Edit post"
description: Modify an existing post
title: "Edit post"
labels: ["edit"]
body:
  - type: markdown
    attributes:
      value: Only the repository owner can edit content. Issues from other users are ignored.
  - type: input
    id: slug
    attributes:
      label: Slug of the post to edit
      description: The post identifier (file name in content/posts without .md).
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: New title (optional)
  - type: dropdown
    id: category
    attributes:
      label: New category (optional)
      options:
        - ""
        - releases
        - progress
        - announcements
  - type: textarea
    id: body
    attributes:
      label: New content (optional)
      description: If left empty, only the filled fields are updated.
