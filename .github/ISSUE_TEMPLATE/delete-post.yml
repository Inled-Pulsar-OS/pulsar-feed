name: "Delete post"
description: Remove an existing post from the feed
title: "Delete post"
labels: ["delete"]
body:
  - type: markdown
    attributes:
      value: Only the repository owner can delete content. Issues from other users are ignored.
  - type: input
    id: slug
    attributes:
      label: Slug of the post to delete
      description: The post identifier (file name in content/posts without .md).
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I confirm I want to permanently delete this post
    validations:
      required: true
