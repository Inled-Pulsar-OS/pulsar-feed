name: "🗑️ Eliminar noticia"
description: Borra una noticia existente del feed
title: "🗑️ Eliminar noticia"
labels: ["delete"]
body:
  - type: input
    id: slug
    attributes:
      label: Slug del post a eliminar
      description: El identificador del post (nombre del archivo en content/posts sin .md).
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmación
      options:
        - label: Confirmo que quiero eliminar este post permanentemente
    validations:
      required: true
